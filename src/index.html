<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRIST sauvegarde</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Outil de sauvegarde de documents GRIST</h1>
      <div class="bloc">
        <div class="msg_hide" id="g_msg"></div>
        <div id="global">
          <div id="g_form">
            <h3>Options globales de l'espace de travail GRIST :</h3>
            <div class="d_sav" style="margin-bottom:0;">
              <div>
                <label>URL du serveur GRIST : <input class="large_input" id="g_server" value="https://grist.numerique.gouv.fr/" /></label><br>
                <label>Clé API : <input id="g_api" class="large_input" placeholder="Clé API..." /></label>
              </div>
              <img class="img_btn img_btn_disabled" id="g_save" src="assets/document-save.svg" title="Enregistrer les modifications"/>
            </div>
          </div>
          <div>
            <h3>Etat du service :</h3>
            <div class="d_sav" style="margin-bottom:0;"">
              <div id="g_statut">
                Arrêté
              </div>
              <img class="img_btn" id="g_stop" src="assets/media-playback-stop.svg" title="Arrêter les sauvegardes programmées"/>
              <img class="img_btn" id="g_go" src="assets/media-playback-start.svg" title="Lancer les sauvegardes programmées"/>
            </div>
          </div>
        </div>
      </div>
      <h2>Documents à sauvegarder :</h2>
      <div id="tabs">
        <img class="img_btn" id="tab_add" src="assets/list-add.svg" title="Ajouter un document à gérer"/>
      </div>
      <div class="bloc">
        <div class="msg_hide" id="d_msg"></div>
        <div id="doc">
          <div class="doc_c" id="d_form" >
            <input id="d_index" type="hidden" value="-1"/>
            <h3 class="doc_c">Identification du document :</h3>
            <div class="d_sav">
              <div>
                <label id="d_lsel">Document GRIST : <select class="large_input" id="d_sel"></select></label><br>
                <label id="d_lid">Identifiant GRIST : <input id="d_id" class="large_input" placeholder="Identifiant du document" /></label><br>
                <label>Nom du document : <input id="d_name" placeholder="Le nom que vous voulez" /></label><br>
              </div>
            </div>
            <h3>Sauvegarde complète :</h3>
            <div class="d_sav">
              <div class="d_sav_form">
                <label><input id="d_savg" type="checkbox" /> Activer la sauvegarde complète (recommandé)</label><br>
                <label>Dossier de destination : <input class="large_input" id="d_savg_dir" placeholder="Dossier sur le disque" /></label><button id="d_savg_dir_open">...</button><br>
                <label>
                  Fréquence de sauvegarde :
                  <input id="d_savg_fd" type="number" min="0" max="30" /> jours
                  <input id="d_savg_fh" type="number" min="0" max="23" /> heures
                  <input id="d_savg_fm" type="number" min="0" max="59" /> minutes
                </label>
              </div>
              <div class="d_sav_actions">
                <img class="img_btn" id="d_savg_now" src="assets/download.svg" title="Effectuer une sauvegarde maintenant"/>
              </div>
            </div>
            <h3>Sauvegarde tableur Excel :</h3>
            <div class="d_sav">
              <div class="d_sav_form">
                <label><input id="d_savx" type="checkbox" /> Activer la sauvegarde Excel (accès hors ligne)</label><br>
                <label>Dossier de destination : <input class="large_input" id="d_savx_dir" placeholder="Dossier sur le disque" /></label></label><button id="d_savx_dir_open">...</button><br>
                <label>
                  Fréquence de sauvegarde :
                  <input id="d_savx_fd" type="number" min="0" max="30" /> jours
                  <input id="d_savx_fh" type="number" min="0" max="23" /> heures
                  <input id="d_savx_fm" type="number" min="0" max="59" /> minutes
                </label>
              </div>
              <div class="d_sav_actions">
                <img class="img_btn" id="d_savx_now" src="assets/download.svg" title="Effectuer une sauvegarde maintenant"/>
              </div>
            </div>
            <div id="d_save_div">
              <img class="img_btn img_btn_disabled" id="d_save" src="assets/document-save.svg" title="Enregistrer les modifications"/>
              <img class="img_btn" id="d_remove" src="assets/user-trash.svg" title="Ne plus gérer ce document"/>
            </div>
          </div>
          <div>
            <h3>Prochaines sauvegardes :</h3>
            <div class="d_sav">
              <div class="logs" id="d_next">
              </div>
            </div>
            <h3>Dernières sauvegardes :</h3>
            <div class="d_sav">
              <div class="logs" id="d_logs">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="notif"></div>
      <img id="a_propos" src="assets/dialog-question.svg" title="A propos"/>
    </main>
  </body>
</html>
